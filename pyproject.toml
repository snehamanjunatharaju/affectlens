[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affectlens"
version = "0.1.0"
description = "A local-first facial expression research and evaluation demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "onnxruntime>=1.19,<2",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "torchvision>=0.21,<1", "scikit-learn>=1.5,<2", "onnx>=1.16,<2", "onnxscript>=0.2,<1", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["affectlens*"]

[tool.setuptools.package-data]
affectlens = [
  "static/*.html",
  "static/*.css",
  "static/*.js",
  "static/vendor/mediapipe/*.mjs",
  "static/vendor/mediapipe/*.task",
  "static/vendor/mediapipe/wasm/*.js",
  "static/vendor/mediapipe/wasm/*.wasm",
]

[tool.ruff]
line-length = 100
target-version = "py311"
