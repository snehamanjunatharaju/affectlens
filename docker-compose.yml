services:
  affectlens:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SAVE_IMAGES: "false"
      AFFECTLENS_MODEL_PATH: /models/fer-ferplus.onnx
    volumes:
      - ./artifacts:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
